<style>
:root{--bg:#0d0d0f;--card:#18181b;--card2:#222226;--tx:#f3f3f4;--mut:#9b9ba4;--acc:#ff6b2c;--acctx:#160a04;--line:#2c2c32;--ok:#3ecf7a}
[data-theme=navy]{--bg:#0a1628;--card:#12223c;--card2:#1a2e4e;--tx:#eaf0fa;--mut:#8fa3c2;--acc:#4da3ff;--acctx:#04162b;--line:#223a60;--ok:#4fd6a0}
[data-theme=military]{--bg:#1a2015;--card:#262e1f;--card2:#313b28;--tx:#eef0e4;--mut:#a4ac92;--acc:#d0bd5c;--acctx:#1c1a06;--line:#3d4832;--ok:#9fd067}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 150px)}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:22px 0 8px;font-weight:700}
p{margin:6px 0}a{color:var(--acc)}
.mut{color:var(--mut)}.sm{font-size:13px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--acc);color:var(--acctx);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.exh{display:flex;gap:12px;align-items:flex-start}
.an{flex:0 0 96px;width:96px;height:96px;background:var(--card2);border-radius:12px;border:1px solid var(--line);padding:0;cursor:pointer}
.an svg{display:block;width:100%;height:100%}
.exi{flex:1;min-width:0}
.exn{font-weight:700;font-size:17px;line-height:1.2}
.rx{font-weight:700;color:var(--acc);margin-top:4px;font-size:14px}
.last{font-size:12.5px;color:var(--mut);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.last b{color:var(--tx)}
.sets{margin-top:8px;display:grid;gap:6px}
.row{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:8px;align-items:center}
.row.t{grid-template-columns:22px 1fr 46px}
.row .i{color:var(--mut);font-size:13px;font-weight:700;text-align:center}
.fld{position:relative}
.fld input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:17px;font-weight:600;padding:0 38px 0 12px;font-family:inherit;min-width:0}
.fld input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.fld span{position:absolute;right:10px;top:13px;font-size:12px;color:var(--mut);pointer-events:none}
.ck{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-size:20px;cursor:pointer}
.row.done .ck{background:var(--ok);border-color:var(--ok);color:#06200f}
.row.done input{opacity:.7}
textarea,select,.txt{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;padding:10px 12px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}

.btn.gh{background:none;border:none;color:var(--mut);padding:0 8px;min-height:36px;font-size:13px}
.btn.wide{width:100%}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{background:none;border:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;padding:8px 0 9px;cursor:pointer;display:grid;justify-items:center;gap:2px}

.timer button{height:38px;min-width:44px;border-radius:10px;border:none;background:#0003;color:inherit;font:inherit;font-weight:700}
.modal{position:fixed;inset:0;background:#000b;z-index:10;display:none;align-items:flex-end}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:92vh;overflow:auto}
.sheet .big{width:min(100%,340px);aspect-ratio:1;margin:8px auto;background:var(--card2);border-radius:16px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.th{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th button{border-radius:12px;border:2px solid var(--line);padding:10px 4px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;color:#fff}
.th button.on{border-color:var(--acc)}
.li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border:none}.li span:last-child{color:var(--mut);white-space:nowrap}
.seg{display:flex;gap:8px}.seg .btn{flex:1}.seg .btn.on{border-color:var(--acc);color:var(--acc)}

svg.anim .fl{stroke:var(--line);stroke-width:1.2}
svg.anim .pr{stroke:var(--mut);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.75}

svg.anim .wp{stroke:var(--acc);stroke-width:10;fill:none}

svg.anim .wb{stroke:var(--acc);stroke-width:1.5;fill:none}
svg.anim .w{stroke:var(--acc);stroke-width:3.6;stroke-linecap:round;fill:none}

const LS='forgia.v1';

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pos(n){n=n==null?S.done:n;const week=Math.floor(n/4),bw=S.blockWeeks;return{n,week,day:n%4,block:Math.floor(week/bw),wib:week%bw,deload:week%bw===bw-1};}
const lvlOf=slot=>Math.min((S.lvl&&S.lvl[slot.id])||0,slot.prog.length-1);
const repsFor=slot=>slot.prog?slot.prog[lvlOf(slot)][1]:slot.reps;
function exFor(slot,block){if(slot.prog)return slot.prog[lvlOf(slot)][0];const L=slot.pool.length;return slot.pool[(Math.floor(block/(slot.rot||1))+(slot.o||0)+(S.swaps[block+':'+slot.id]||0))%L];}
const setsFor=(slot,dl)=>dl?Math.ceil(slot.sets/2):slot.sets;
function rirFor(p){if(p.deload)return 4;const w=S.blockWeeks-1;return w<2?2:Math.round(3-2*p.wib/(w-1));}
const mmss=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
function lastPerf(exId){for(let i=S.logs.length-1;i>=0;i--){const es=S.logs[i].e;for(const k in es){const e=es[k];if(e.ex===exId&&(e.res||(e.sets&&e.sets.some(s=>s.done))))return{e,log:S.logs[i]};}}return null;}
function fmtSets(e,t){if(e.res)return e.res;return e.sets.filter(s=>s.done).map(s=>t==='time'?(s.kg?s.kg+' kg · ':'')+s.reps+' s':(s.kg?s.kg+' kg × ':'')+s.reps).join('  ·  ');}
function draftEntry(slot,exId,n){
 const p=pos();if(!S.draft||S.draft.n!==p.n)S.draft={n:p.n,e:{}};
 let e=S.draft.e[slot.id];
 if(!e||e.ex!==exId){e=S.draft.e[slot.id]=slot.cardio?{ex:exId,res:''}:{ex:exId,sets:Array.from({length:n},()=>({kg:'',reps:'',done:false}))};}
 return e;
}
function advice(slot,ex,last){
 if(!last||!last.e.sets)return'Prima volta: scegli un carico che ti lasci 2–3 ripetizioni di margine.';
 const d=last.e.sets.filter(s=>s.done);
 const top=d.length>=slot.sets&&d.every(s=>+s.reps>=repsFor(slot)[1]);
 if(top&&slot.prog)return lvlOf(slot)<slot.prog.length-1?'↑ Range completato in tutte le serie: sei pronto per il livello successivo.':'↑ Range completato: aggiungi una ripetizione o una serie.';
 if(top)return ex.t==='load'?'↑ Hai chiuso tutte le serie al massimo del range: aumenta di 1–2 kg.':ex.t==='time'?'↑ Range completato: aggiungi 10 s o aumenta il peso.':'↑ Range completato: aggiungi zavorra o rallenta la discesa.';
 return ex.t==='time'?'→ Stessa difficoltà, punta a qualche secondo in più.':'→ Stesso carico, punta a una ripetizione in più.';
}

 h+=`<p class="sm mut" style="text-align:center">Durata stimata: circa ${Math.round(est/5)*5} minuti</p>

 return h;
}

function viewPlan(){

 <h2>Questo blocco</h2>`+DAYS.map(d=>dayList(d,p.block)).join('')+

 `<h2>Perché è fatto così</h2><div class="card sm">
 <p><b>Volume.</b> 10–20 serie a settimana per gruppo muscolare: sotto le 10 si cresce meno, oltre i guadagni calano. <a href="https://sportrxiv.org/index.php/server/preprint/download/537/1148/1071" target="_blank" rel="noopener">Pelland et al.</a>, <a href="https://jhk.termedia.pl/A-Systematic-Review-of-the-Effects-of-Different-Resistance-Training-Volumes-on-Muscle,158681,0,2.html" target="_blank" rel="noopener">Baz-Valle et al. 2022</a></p>
 <p><b>Rotazione.</b> Variare gli esercizi in modo pianificato aiuta e motiva; cambiarli troppo spesso o a caso frena i progressi. Per questo si ruota a blocchi e non a ogni seduta. <a href="https://pubmed.ncbi.nlm.nih.gov/35438660/" target="_blank" rel="noopener">Kassiano et al. 2022</a></p>

 <p><b>Recuperi.</b> Più di 60 s tra le serie dà un piccolo vantaggio; oltre i 90 s non cambia molto, salvo sui fondamentali pesanti. <a href="https://www.frontiersin.org/articles/10.3389/fspor.2024.1429789/full" target="_blank" rel="noopener">Singer et al. 2024</a></p>

function spark(vals){
 if(vals.length<2)return'<p class="sm mut">Servono almeno due sessioni per il grafico.</p>';
 const mx=Math.max(...vals),mn=Math.min(...vals),r=(mx-mn)||1;
 const pts=vals.map((v,i)=>[6+i*(288/(vals.length-1)),70-(v-mn)/r*56]);
 return `<svg viewBox="0 0 300 80" style="width:100%;display:block"><polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--acc)"/>`).join('')}</svg><div class="li sm"><span>min ${mn}</span><span>max ${mx}</span></div>`;
}
function viewHist(){

 if(!S.logs.length)return h+'<div class="card mut">Ancora nessun allenamento registrato. Concludi la prima sessione e la troverai qui.</div>';
 const seen={};S.logs.forEach(l=>{for(const k in l.e){const e=l.e[k];if(e.sets&&e.sets.some(s=>s.done))seen[e.ex]=1;}});
 const ids=Object.keys(seen).sort((a,b)=>EX[a].n.localeCompare(EX[b].n));
 if(ids.length){
  if(!seen[histEx])histEx=ids[0];
  const ex=EX[histEx],vals=[];
  S.logs.forEach(l=>{for(const k in l.e){const e=l.e[k];if(e.ex===histEx&&e.sets){const d=e.sets.filter(s=>s.done);if(d.length)vals.push(Math.max(...d.map(s=>ex.t==='load'?(+s.kg||0):(+s.reps||0))));}}});
  h+=`<h2>Andamento</h2><div class="card"><select data-f="histEx" aria-label="Esercizio">${ids.map(i=>`<option value="${i}"${i===histEx?' selected':''}>${EX[i].n}</option>`).join('')}</select>
  <p class="sm mut">${ex.t==='load'?'Carico massimo per sessione (kg)':ex.t==='time'?'Tenuta migliore per sessione (s)':'Serie migliore per sessione (rep)'}</p>${spark(vals)}</div>`;
 }
 h+='<h2>Sessioni</h2>';
 S.logs.slice().reverse().forEach(l=>{
  const d=new Date(l.date),day=DAYS[l.day];let vol=0;
  const rows=Object.values(l.e).map(e=>{const ex=EX[e.ex];if(!ex)return'';if(e.sets)e.sets.forEach(s=>{if(s.done&&ex.t==='load')vol+=(+s.kg||0)*(+s.reps||0)});const t=fmtSets(e,ex.t);return t?`<div class="li"><span>${ex.n}</span><span style="white-space:normal;text-align:right">${esc(t)}</span></div>`:''}).join('');
  h+=`<div class="card"><div class="exh" style="justify-content:space-between"><div><div class="exn">${day.name}</div><div class="mut sm">${d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})} · blocco ${l.block+1}${l.deload?' · scarico':''}</div></div>${vol?`<span class="chip">${Math.round(vol)} kg</span>`:''}</div>${rows||'<p class="sm mut">Sessione saltata</p>'}${l.note?`<p class="sm mut">“${esc(l.note)}”</p>`:''}</div>`;
 });
 return h;
}
function viewOpt(){
 const th=[['dark','Scuro','#0d0d0f'],['navy','Blu navy','#12223c'],['military','Verde militare','#313b28']];
 return `<div class="top"><h1>Opzioni</h1></div>
 <h2>Tema</h2><div class="th">${th.map(t=>`<button data-act="theme" data-v="${t[0]}" class="${S.theme===t[0]?'on':''}" style="background:${t[2]}">${t[1]}</button>`).join('')}</div>
 <h2>Durata del blocco</h2><div class="seg">${[4,6,8].map(n=>`<button class="btn${S.blockWeeks===n?' on':''}" data-act="bw" data-v="${n}">${n} settimane</button>`).join('')}</div>
 <p class="sm mut">Ogni quante settimane cambiano gli esercizi. L'ultima settimana di ogni blocco è di scarico.</p>
 <h2>I tuoi dati</h2><p class="sm mut">Tutto resta salvato solo su questo dispositivo. Esporta ogni tanto una copia di sicurezza.</p>
 <p><button class="btn wide" data-act="export">Esporta copia di sicurezza</button></p>
 <p><label class="btn wide">Importa copia di sicurezza<input type="file" accept="application/json,.json" id="imp" hidden></label></p>
 <p><button class="btn wide" data-act="reset" style="color:#ff7b7b">Cancella tutti i dati</button></p>
 <h2>Installazione su iPhone</h2><p class="sm mut">Apri la pagina in Safari, tocca Condividi e poi «Aggiungi alla schermata Home».</p>`;
}
function render(){
 document.documentElement.dataset.theme=S.theme;
 const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
 document.querySelector('meta[name=theme-color]').content=bg;
 $('#view').innerHTML=({oggi:viewToday,piano:viewPlan,storico:viewHist,opz:viewOpt})[tab]();
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 save();
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600);}

/* ================= TIMER RECUPERO ================= */
let tEnd=0,tInt=0;
function startTimer(sec){tEnd=Date.now()+sec*1000;$('#timer').classList.add('on');clearInterval(tInt);tInt=setInterval(updT,250);updT();}
function stopTimer(){clearInterval(tInt);$('#timer').classList.remove('on');}
function updT(){const r=(tEnd-Date.now())/1000;if(r<=0){stopTimer();toast('Recupero finito: prossima serie');if(navigator.vibrate)navigator.vibrate(200);return;}$('#tt').textContent=mmss(Math.ceil(r));}
$('#timer').addEventListener('click',e=>{const t=e.target.dataset.t;if(t==='add'){tEnd+=15000;updT();}if(t==='stop')stopTimer();});

/* ================= EVENTI ================= */
function slotOf(el){const c=el.closest('[data-slot]');if(!c)return null;const p=pos();return DAYS[p.day].slots.find(s=>s.id===c.dataset.slot);}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.tab;render();scrollTo(0,0);}});
$('#view').addEventListener('input',e=>{
 const f=e.target.dataset.f;if(!f)return;
 if(f==='note'){if(!S.draft)S.draft={n:S.done,e:{}};S.draft.note=e.target.value;save();return;}
 if(f==='histEx')return;
 const slot=slotOf(e.target);if(!slot)return;const en=S.draft.e[slot.id];
 if(f==='res')en.res=e.target.value;else{const r=e.target.closest('.row');en.sets[+r.dataset.i][f]=e.target.value;}
 save();
});
$('#view').addEventListener('change',e=>{
 if(e.target.dataset.f==='histEx'){histEx=e.target.value;render();}
 if(e.target.id==='imp'&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!Array.isArray(d.logs))throw 0;S=Object.assign({v:1,theme:'dark',blockWeeks:4,done:0,logs:[],swaps:{},draft:null},d);render();toast('Dati importati');}catch(x){toast('File non valido: nessun dato modificato');}};fr.readAsText(e.target.files[0]);}
});
$('#view').addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,p=pos();
 if(act==='info'){openInfo(b.dataset.ex);return;}
 if(act==='ck'){
  const slot=slotOf(b),row=b.closest('.row'),s=S.draft.e[slot.id].sets[+row.dataset.i];
  if(!s.done){const prev=S.draft.e[slot.id].sets[+row.dataset.i-1],kgI=row.querySelector('[data-f=kg]');
   if(prev&&prev.kg&&kgI.value===''){kgI.value=prev.kg;s.kg=prev.kg;}
   row.querySelectorAll('input').forEach(inp=>{if(inp.value===''&&inp.placeholder!=='—'&&inp.placeholder!=='0'){inp.value=inp.placeholder;s[inp.dataset.f]=inp.value;}});
   if(!s.reps){toast('Inserisci prima le ripetizioni');return;}
   s.done=true;row.classList.add('done');startTimer(slot.rest);}
  else{s.done=false;row.classList.remove('done');}
  save();return;
 }
 if(act==='lvl'){const slot=slotOf(b);S.lvl=S.lvl||{};S.lvl[slot.id]=Math.max(0,Math.min(slot.prog.length-1,lvlOf(slot)+ +b.dataset.v));delete S.draft.e[slot.id];render();toast('Livello '+(lvlOf(slot)+1)+': '+EX[exFor(slot)].n);return;}
 if(act==='swap'){const slot=slotOf(b),k=p.block+':'+slot.id;S.swaps[k]=((S.swaps[k]||0)+1)%slot.pool.length;delete S.draft.e[slot.id];render();toast('Esercizio cambiato per questo blocco');return;}
 if(act==='finish'||act==='skip'){
  const es={};let any=false;
  if(act==='finish'){for(const k in S.draft.e){const en=S.draft.e[k];if(en.res&&en.res.trim()){es[k]=en;any=true;}else if(en.sets&&en.sets.some(s=>s.done)){es[k]={ex:en.ex,sets:en.sets.filter(s=>s.done)};any=true;}}
   if(!any){toast('Segna almeno una serie con ✓ prima di concludere');return;}}
  else if(!confirm('Saltare questa sessione? Il programma passa alla successiva.'))return;
  S.logs.push({n:p.n,date:new Date().toISOString(),day:p.day,week:p.week,block:p.block,deload:p.deload,e:es,note:act==='finish'?(S.draft.note||''):''});
  S.done++;S.draft=null;stopTimer();
  const np=pos();render();scrollTo(0,0);
  toast(act==='skip'?'Sessione saltata':np.block!==p.block?'Blocco completato: nuovi esercizi!':'Allenamento salvato. Ottimo lavoro!');return;
 }
 if(act==='theme'){S.theme=b.dataset.v;render();return;}
 if(act==='bw'){S.blockWeeks=+b.dataset.v;S.draft=null;render();return;}
 if(act==='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='forgia-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();return;}
 if(act==='reset'){if(confirm('Cancellare tutti gli allenamenti e ripartire da zero? Non si può annullare.')){const th=S.theme;S={v:1,theme:th,blockWeeks:4,done:0,logs:[],swaps:{},draft:null};tab='oggi';render();toast('Dati cancellati');}}
});
function openInfo(id){
 const ex=EX[id];
 $('#sheet').innerHTML=`<div class="exh" style="justify-content:space-between;align-items:center"><div class="exn" style="font-size:20px">${ex.n}</div><button class="btn" data-close>Chiudi</button></div>
 <div class="big">${animSvg(ex.a).replace('class="anim"','class="anim" style="width:100%;height:100%"')}</div>
 <div class="chips"><span class="chip">${ex.m}</span><span class="chip">${ex.eq}</span></div><p>${ex.cue}</p>`;
 $('#modal').classList.add('on');
}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))$('#modal').classList.remove('on');});

/* ================= VERIFICA (criteri misurabili) ================= */
window.__audit=function(){
 const miss=[],dup=[],bad=[];
 for(const id in EX){const a=A[EX[id].a];if(!a||a.f.length<2)miss.push(id);else a.f.forEach(q=>JN.forEach(j=>{if(!Array.isArray(q[j])||(q[j][0]<-2||q[j][0]>102||q[j][1]>102||q[j][1]<92.6-94.6/(a.sc||1)))bad.push(id+'.'+j)}));}
 DAYS.forEach(d=>d.slots.forEach(s=>s.pool.forEach(id=>{if(!EX[id])miss.push('pool:'+id)})));
 const sw=S.swaps;S.swaps={};
 for(let b=0;b<12;b++)DAYS.forEach(d=>{const ids=d.slots.map(s=>exFor(s,b));if(new Set(ids).size!==ids.length)dup.push(d.id+'@'+b);});
 let diff=0,tot=0;DAYS.forEach(d=>d.slots.forEach(s=>{tot++;if(exFor(s,0)!==exFor(s,1))diff++;}));
 S.swaps=sw;
 const sets={};DAYS.forEach(d=>d.slots.forEach(s=>{if(s.cardio)return;sets[s.g]=(sets[s.g]||0)+s.sets;if(s.s)sets[s.s]=(sets[s.s]||0)+s.sets*.5;}));
 return{esercizi:Object.keys(EX).length,animazioniMancanti:miss,giuntiFuoriQuadro:bad,doppioniNelGiorno:dup,slotCheCambianoAlNuovoBlocco:diff+'/'+tot,serieSettimanali:sets};
};

render();requestAnimationFrame(tick);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
